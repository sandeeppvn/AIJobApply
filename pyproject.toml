[tool.poetry]
name = "aijobapply"
version = "0.1.0"
description = "Package to scrape a job based on a URL, create customized email, resume and cover letter using LLMs."
authors = ["Sandeep Polavarapu <sandeeppvn@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
configparser = "^6.0.1"
openai = "^1.16.2"
pytest = "^8.1.1"
python-dotenv = "^1.0.1"
tqdm = "^4.66.2"
requests = "^2.31.0"
gspread = "^6.1.0"
pandas = "^2.2.1"
selenium = "^4.19.0"
tk = "^0.1.0"
langchain = "^0.1.15"
validate-email = "^1.3"
pydantic = "^2.6.4"
gptrim = "^0.1.6"
docxtpl = "^0.16.8"
python-docx = "^1.1.0"
google-api-python-client = "^2.125.0"
gradio = "^4.26.0"
beautifulsoup4 = "^4.12.3"
playwright = "^1.43.0"
langchain-openai = "^0.1.2"
langchain-community = "^0.0.32"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
